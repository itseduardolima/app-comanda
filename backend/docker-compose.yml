services:
  postgres:
    image: postgres:16-alpine
    container_name: app-comanda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_comanda
      POSTGRES_PASSWORD: app_comanda
      POSTGRES_DB: app_comanda
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
